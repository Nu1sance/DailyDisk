name: Stress tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  million-row-inventory:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run million-row staging and canonicalization
        env:
          DAILYDISK_RUN_STRESS: "1"
        run: swift test --filter millionRecordInventory
